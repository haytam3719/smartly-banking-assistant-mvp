[project]
name = "smartly-ai-banking-assistant"
version = "1.0.0"
description = "Production-oriented AI banking assistant using explicit RAG/Tools orchestration"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.6,<2",
  "qdrant-client>=1.19,<2",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pycryptodome>=3.23,<4",
  "tenacity>=9,<10",
  "structlog>=25,<26",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires external infrastructure",
  "live_llm: requires a real LLM API key",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
